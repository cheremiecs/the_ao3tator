<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AO3 Annotator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="header-row">
      <h1>AO3 Annotator</h1>
      <button type="button" id="theme-toggle-btn" title="Toggle dark mode"></button>
    </div>
    <div id="backup-reminder"></div>
    <div class="backup-actions">
      <button type="button" id="export-btn">Export backup</button>
      <button type="button" id="import-btn">Import backup</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none" />
    </div>
    <div id="work-list"></div>
    <script src="../../dist/popup.js"></script>
  </body>
</html>
